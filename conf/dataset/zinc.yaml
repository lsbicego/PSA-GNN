name: ZINC
root: ${oc.env:DATA_ROOT,./data}/ZINC
source: ZINC
split: predefined
subset: true
force_reload: True
multiprocess: False
pre_filter:
pre_transform:
  - name: ExpandEdgeAttrs
transform:
task: graph_regression
num_classes: 1
loader_params:
  pin_memory: true
  num_workers: 8
  persistent_workers: true
  prefetch_factor: 4
optimization_params:
  batch_size: 64
  learning_rate: 0.001
  weight_decay: 0.00001
  warmup_epochs: 25 # only used for cosine scheduler
  max_epochs: 500
  early_stop_patience: 100
  scheduler: "ReduceLROnPlateau" # options: ReduceLROnPlateau, CosineAnnealingLR
model_params:
  hidden_dim: 64
  num_layers: 8
  conv_dropout: 0.0
  head_dropout: 0.0
  readout: "mean"
  intermediate_mlp: false
  encode_subgraph_size: false
