[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "psa-gnn"
version = "0.1.0"
description = "Pooling-induced substructures, hierarchical graph benchmarks, and nested-SBM descriptors"
readme = "README.md"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
